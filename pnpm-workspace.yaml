# pnpm 10 makes every postinstall script opt-in. These four are not optional here:
#
#   workerd / esbuild — wrangler runs the Worker locally and OpenNext bundles it for
#     Cloudflare; both ship a platform binary that the postinstall fetches. Skipped,
#     they fail at RUN time, not install time, which is a miserable way to find out.
#   sharp — Next's image optimiser.
#   unrs-resolver — the resolver behind eslint-plugin-import.
#
# While unapproved, `pnpm build` aborted with ERR_PNPM_IGNORED_BUILDS before Next
# even started — which is why the build was being invoked as ./node_modules/.bin/next
# to sidestep the check. It no longer has to be.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

# Security overrides (pnpm audit 2026-08-04) — transitivas presas por pais que pinam
# versão vulnerável. Todas patch/minor dentro do range do CVE:
#   postcss    — next pina 8.4.31 exato; CVEs de sourcemap/path traversal (<8.5.23)
#   sharp      — next quer ^0.34; libvips CVEs herdados (<0.35.0)
#   brace-exp. — DoS em 3 majors distintos via minimatch (eslint/glob/redocly)
#   js-yaml    — merge-key quadrático (<4.3.0), via @redocly/openapi-core
#   undici     — 5 advisories (<7.29.0), via wrangler>miniflare
overrides:
  "postcss@8": ^8.5.23
  "sharp@0.34": ^0.35.0
  "brace-expansion@1": ^1.1.18
  "brace-expansion@2": ^2.1.4
  "brace-expansion@5": ^5.0.9
  "js-yaml@4": ^4.3.0
  "undici@7": ^7.29.0
